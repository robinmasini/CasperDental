<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casper Dental</title>
  <script>
    (function() {
      function showError(title, message) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = '#ef4444';
        div.style.color = 'white';
        div.style.padding = '24px';
        div.style.zIndex = '9999999';
        div.style.fontFamily = 'monospace';
        div.style.whiteSpace = 'pre-wrap';
        div.style.fontSize = '14px';
        div.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
        div.innerText = title + ':\n' + message;
        
        if (document.body) {
          document.body.appendChild(div);
        } else {
          document.documentElement.appendChild(div);
        }
      }

      window.onerror = function(msg, url, line, col, error) {
        showError('CRITICAL RUNTIME ERROR', msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + '\nStack:\n' + (error ? error.stack : ''));
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        showError('UNHANDLED PROMISE REJECTION', event.reason + (event.reason && event.reason.stack ? '\nStack:\n' + event.reason.stack : ''));
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
